# Render's free plan puts the 98 Messenger server to sleep after 15 minutes without
# visitors, and waking it takes 20-50 seconds. This pings it every 10 minutes so it stays
# awake. Free: scheduled workflows cost nothing on public repositories.
# Note: GitHub pauses scheduled workflows after 60 days with no commits to the repo;
# re-enable it from the Actions tab if that happens.
name: Keep chat server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping nine8ish.onrender.com
        run: curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://nine8ish.onrender.com/
