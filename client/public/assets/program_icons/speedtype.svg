<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Speed Typist 98: a red race car speeding over a keyboard toward a checkered flag -->
  <!-- keyboard -->
  <rect x="2" y="27" width="44" height="18" fill="#c8c8c8" stroke="#000"/>
  <path d="M3 44V28h42" fill="none" stroke="#fff"/>
  <g fill="#f0f0f0" stroke="#404040">
    <rect x="5" y="30" width="5" height="4"/><rect x="11" y="30" width="5" height="4"/><rect x="17" y="30" width="5" height="4"/>
    <rect x="23" y="30" width="5" height="4"/><rect x="29" y="30" width="5" height="4"/><rect x="35" y="30" width="5" height="4"/>
    <rect x="7" y="35" width="5" height="4"/><rect x="13" y="35" width="5" height="4"/><rect x="19" y="35" width="5" height="4"/>
    <rect x="25" y="35" width="5" height="4"/><rect x="31" y="35" width="5" height="4"/><rect x="37" y="35" width="5" height="4"/>
    <rect x="13" y="40" width="22" height="3"/>
  </g>
  <!-- checkered flag -->
  <rect x="38" y="3" width="1" height="22" fill="#404040"/>
  <g fill="#000"><rect x="39" y="3" width="3" height="3"/><rect x="42" y="6" width="3" height="3"/><rect x="39" y="9" width="3" height="3"/><rect x="45" y="3" width="1" height="3"/><rect x="45" y="9" width="1" height="3"/></g>
  <g fill="#fff"><rect x="42" y="3" width="3" height="3"/><rect x="39" y="6" width="3" height="3"/><rect x="42" y="9" width="3" height="3"/><rect x="45" y="6" width="1" height="3"/></g>
  <path d="M39 3h7v9h-7z" fill="none" stroke="#000" stroke-width=".5"/>
  <!-- speed lines -->
  <g fill="#1858d0"><rect x="1" y="12" width="6" height="1"/><rect x="2" y="16" width="5" height="1"/><rect x="0" y="20" width="7" height="1"/></g>
  <!-- the car -->
  <path d="M8 18h7l3-5h8l4 5h5l1 2v4H8z" fill="#d01818" stroke="#000"/>
  <rect x="9" y="19" width="26" height="1" fill="#fff" opacity=".5"/>
  <path d="M19 14h6l3 4h-9z" fill="#a8d8ff" stroke="#000" stroke-width=".6"/>
  <rect x="21" y="14" width="3" height="3" fill="#fff" stroke="#000" stroke-width=".5"/>
  <rect x="12" y="20" width="5" height="3" fill="#fff" stroke="#000" stroke-width=".5"/>
  <g shape-rendering="geometricPrecision">
    <circle cx="13" cy="24" r="3.4" fill="#181818"/><circle cx="13" cy="24" r="1.3" fill="#b0b0b0"/>
    <circle cx="31" cy="24" r="3.4" fill="#181818"/><circle cx="31" cy="24" r="1.3" fill="#b0b0b0"/>
  </g>
  <rect x="35" y="19" width="2" height="2" fill="#ffe860"/>
</svg>
