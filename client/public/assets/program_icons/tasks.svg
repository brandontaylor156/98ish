<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Tasks: a clipboard with a to-do list (two ticked, one with a red "!") and a pencil -->
  <rect x="9" y="7" width="32" height="39" fill="#000"/>
  <rect x="8" y="6" width="32" height="39" fill="#a0642a"/>
  <rect x="8" y="6" width="32" height="1" fill="#c8884a"/>
  <rect x="8" y="6" width="1" height="39" fill="#c8884a"/>
  <rect x="12" y="11" width="24" height="31" fill="#fff"/>
  <rect x="35" y="11" width="1" height="31" fill="#c0c0c0"/>
  <rect x="12" y="41" width="24" height="1" fill="#c0c0c0"/>
  <!-- the clip -->
  <rect x="17" y="3" width="14" height="7" fill="#404040"/>
  <rect x="18" y="4" width="12" height="5" fill="#c0c0c0"/>
  <rect x="18" y="4" width="12" height="1" fill="#fff"/>
  <rect x="22" y="1" width="4" height="4" fill="#404040"/>
  <rect x="23" y="2" width="2" height="2" fill="#808080"/>
  <!-- rows: box, tick, line -->
  <g fill="none" stroke="#000" stroke-width="1">
    <rect x="14.5" y="15.5" width="4" height="4"/><rect x="14.5" y="23.5" width="4" height="4"/><rect x="14.5" y="31.5" width="4" height="4"/>
  </g>
  <g fill="#008000">
    <rect x="15" y="17" width="1" height="1"/><rect x="16" y="18" width="1" height="1"/><rect x="17" y="17" width="1" height="1"/><rect x="18" y="16" width="1" height="1"/><rect x="19" y="15" width="1" height="1"/>
    <rect x="15" y="25" width="1" height="1"/><rect x="16" y="26" width="1" height="1"/><rect x="17" y="25" width="1" height="1"/><rect x="18" y="24" width="1" height="1"/><rect x="19" y="23" width="1" height="1"/>
  </g>
  <g fill="#808080">
    <rect x="21" y="17" width="11" height="1"/><rect x="21" y="25" width="9" height="1"/>
  </g>
  <rect x="21" y="33" width="10" height="1" fill="#000080"/>
  <rect x="33" y="31" width="1" height="3" fill="#c00000"/>
  <rect x="33" y="35" width="1" height="1" fill="#c00000"/>
  <!-- pencil -->
  <g>
    <rect x="38" y="20" width="4" height="18" fill="#ffd400"/>
    <rect x="38" y="20" width="1" height="18" fill="#fff080"/>
    <rect x="41" y="20" width="1" height="18" fill="#c09000"/>
    <rect x="38" y="17" width="4" height="3" fill="#e080a0"/>
    <rect x="38" y="19" width="4" height="1" fill="#a0a0a0"/>
    <rect x="38" y="38" width="4" height="2" fill="#f0c890"/>
    <rect x="39" y="40" width="2" height="2" fill="#f0c890"/>
    <rect x="39" y="41" width="2" height="1" fill="#202020"/>
  </g>
</svg>
