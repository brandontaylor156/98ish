<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Video Poker: a blue screen showing a hand, with HELD over two cards -->
  <rect x="3" y="7" width="42" height="34" rx="2" fill="#c0c0c0" stroke="#000" stroke-width="1.2"/>
  <rect x="6" y="10" width="36" height="25" fill="#000080" stroke="#808080"/>
  <g fill="#fff" stroke="#000" stroke-width=".6">
    <rect x="8" y="19" width="6" height="9"/>
    <rect x="15" y="19" width="6" height="9"/>
    <rect x="22" y="19" width="6" height="9"/>
    <rect x="29" y="19" width="6" height="9"/>
    <rect x="36" y="19" width="5" height="9"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="bold" font-size="5" text-anchor="middle">
    <text x="11" y="25.5" fill="#d40000">A</text>
    <text x="18" y="25.5" fill="#d40000">A</text>
    <text x="25" y="25.5">9</text>
    <text x="32" y="25.5">4</text>
    <text x="38.5" y="25.5" fill="#d40000">2</text>
  </g>
  <g fill="#ffd800" font-family="Arial, sans-serif" font-weight="bold" font-size="3.6" text-anchor="middle">
    <text x="11" y="17">HELD</text>
    <text x="18" y="17">HELD</text>
  </g>
  <text x="24" y="33" fill="#ffd800" font-family="Courier New, monospace" font-weight="bold" font-size="4.5" text-anchor="middle">JACKS OR BETTER</text>
  <rect x="14" y="41" width="20" height="4" fill="#808080" stroke="#000" stroke-width=".8"/>
</svg>
