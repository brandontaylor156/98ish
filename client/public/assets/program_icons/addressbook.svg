<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Address Book: a blue bound book with letter tabs down its edge and a little person card -->
  <rect x="9" y="6" width="32" height="39" fill="#000"/>
  <rect x="8" y="5" width="32" height="39" fill="#1c48a8"/>
  <rect x="8" y="5" width="32" height="1" fill="#5d8fff"/>
  <rect x="8" y="5" width="1" height="39" fill="#5d8fff"/>
  <rect x="8" y="5" width="5" height="39" fill="#102c70"/>
  <g fill="#c0c0c0">
    <rect x="9" y="9" width="3" height="2"/><rect x="9" y="15" width="3" height="2"/><rect x="9" y="21" width="3" height="2"/>
    <rect x="9" y="27" width="3" height="2"/><rect x="9" y="33" width="3" height="2"/><rect x="9" y="39" width="3" height="2"/>
  </g>
  <rect x="38" y="6" width="2" height="38" fill="#fff"/>
  <rect x="38" y="6" width="1" height="38" fill="#e0e0e0"/>
  <g fill="#e0c020">
    <rect x="40" y="9" width="4" height="5"/>
  </g>
  <g fill="#30a040">
    <rect x="40" y="17" width="4" height="5"/>
  </g>
  <g fill="#d03030">
    <rect x="40" y="25" width="4" height="5"/>
  </g>
  <g fill="#000">
    <rect x="44" y="10" width="1" height="5"/><rect x="44" y="18" width="1" height="5"/><rect x="44" y="26" width="1" height="5"/>
  </g>
  <!-- the card on the cover -->
  <rect x="16" y="13" width="19" height="15" fill="#000"/>
  <rect x="15" y="12" width="19" height="15" fill="#fff3d0"/>
  <rect x="17" y="14" width="7" height="9" fill="#c8b070"/>
  <rect x="19" y="15" width="3" height="3" fill="#f0c090"/>
  <rect x="18" y="18" width="5" height="4" fill="#d03030"/>
  <rect x="19" y="14" width="3" height="1" fill="#603010"/>
  <g fill="#808080">
    <rect x="26" y="15" width="6" height="1"/><rect x="26" y="18" width="6" height="1"/><rect x="26" y="21" width="4" height="1"/>
    <rect x="17" y="24" width="15" height="1"/>
  </g>
  <g fill="#fff">
    <rect x="16" y="33" width="18" height="1"/><rect x="16" y="36" width="12" height="1"/>
  </g>
